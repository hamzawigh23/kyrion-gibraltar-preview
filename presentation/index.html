<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kyrion — Desktop and mobile presentation</title><style>
@font-face{font-family:Figtree;src:url('../assets/figtree-400.woff')}@font-face{font-family:Figtree;src:url('../assets/figtree-800.woff');font-weight:800}*{box-sizing:border-box}body{margin:0;background:#ecede7;color:#173d31;font-family:Figtree,Arial,sans-serif}.presentation{min-height:100vh;display:flex;flex-direction:column;padding:34px clamp(24px,6vw,95px) 24px;background:radial-gradient(ellipse at 50% 50%,#fafbf7,#e8ebe3)}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:17px;letter-spacing:.15em;margin:0;font-weight:800}header p{margin:6px 0 0;font-size:12px;color:#657265}nav{display:flex;gap:8px}nav a{font-size:11px;color:inherit;text-decoration:none;border:1px solid #bbc5b8;padding:9px 14px;border-radius:30px}nav a[aria-current]{background:#173d31;color:white;border-color:#173d31}.scene{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:30px 0}.laptop{width:min(1160px,84vw,calc((100vh - 208px)*1.6));position:relative;filter:drop-shadow(0 22px 24px #1c302022)}.bezel{padding:12px 12px 15px;border:2px solid #606561;border-radius:19px 19px 6px 6px;background:linear-gradient(145deg,#303431,#0b0e0c);position:relative;box-shadow:0 0 0 1px #121a15}.bezel::before{content:'';position:absolute;top:4px;left:50%;width:4px;height:4px;border-radius:50%;background:#586d61}.screen{position:relative;aspect-ratio:1440/900;overflow:hidden;background:#173d31;border-radius:4px}iframe{display:block;border:0;position:absolute;top:0;left:0;width:1440px;height:900px;transform-origin:top left}.base{position:relative;left:-5%;width:110%;height:17px;background:linear-gradient(#dfe3dc,#b5bdb3 35%,#7a877b);border-radius:2px 2px 55% 55%/2px 2px 12px 12px;border-bottom:2px solid #8c988d}.base::before{content:'';position:absolute;width:14%;height:5px;left:43%;top:0;background:#8c978d;border-radius:0 0 9px 9px}.phone{display:none;width:min(350px,calc((100vh - 171px)*390/880));padding:15px 9px 12px;background:linear-gradient(145deg,#414942,#101710);border:2px solid #748073;border-radius:38px;box-shadow:0 0 0 1px #16261a,0 22px 45px #1c302025;position:relative}.phone::before{content:'';position:absolute;top:5px;left:50%;height:4px;width:32px;background:#8b9d8b;border-radius:4px;transform:translateX(-50%)}.phone .screen{aspect-ratio:390/844;border-radius:23px}.phone iframe{width:390px;height:844px}.phone::after{content:'';position:absolute;bottom:4px;left:42%;height:3px;width:16%;background:#b0b9ad;border-radius:2px}.mobile .laptop{display:none}.mobile .phone{display:block}footer{text-align:center;color:#6e7b6b;font-size:11px;letter-spacing:.02em}body.mobile .scene{padding:14px 0 20px}button{font:inherit}@media(max-width:700px){.presentation{padding:24px 20px 20px}header p{font-size:10px}h1{font-size:14px}.laptop{width:92vw}nav a{padding:7px 10px}footer{font-size:10px}}
</style></head><body><main class="presentation"><header><div><h1>KYRION</h1><p>Independent website design concept</p></div><nav aria-label="Device preview"><a href="?view=desktop" data-view="desktop">Desktop</a><a href="?view=mobile" data-view="mobile">Mobile</a></nav></header><div class="scene"><div class="laptop"><div class="bezel"><div class="screen"><iframe title="Kyrion desktop website" loading="eager"></iframe></div></div><div class="base"></div></div><div class="phone"><div class="screen"><iframe title="Kyrion mobile website" loading="eager"></iframe></div></div></div><footer>Prepared by Hamza Ghailan · Desktop & mobile website preview</footer></main><script>
